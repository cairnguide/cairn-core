# The Codespaces environment: the app container shares the database container's network,
# so MongoDB is on localhost:27017 inside the Codespace, exactly as .env.example expects.
services:
  app:
    image: mcr.microsoft.com/devcontainers/python:1-3.12-bookworm
    volumes:
      - ../..:/workspaces:cached
    command: sleep infinity
    network_mode: service:db
    privileged: true  # docker-in-docker, for building the Cloudflare container image

  db:
    image: mongo:8.0
    restart: unless-stopped
    environment:
      # Throwaway development database, not a real credential.
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
    # A replica set (for transactions) with authentication needs a keyfile. A fresh one each start
    # is fine for a single member. scripts/dev-setup.sh initiates the replica set the first time.
    entrypoint:
      - bash
      - -c
      - >-
        head -c 756 /dev/urandom | base64 > /tmp/keyfile && chmod 400 /tmp/keyfile && chown 999:999 /tmp/keyfile
        && exec docker-entrypoint.sh mongod --replSet rs0 --keyFile /tmp/keyfile --bind_ip_all
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "-u", "admin", "-p", "admin", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mongo-data:
