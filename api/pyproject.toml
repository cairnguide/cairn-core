[project]
name = "cairn-api"
version = "0.1.0"
description = "Cairn MVP HTTP API. Implements the MVP use cases on top of the Cairn MongoDB database."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pymongo>=4.9,<5",
  "pyjwt[crypto]>=2.8",
  "httpx>=0.27",
  "pyyaml>=6",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27", "jsonschema>=4.18"]
lint = ["ruff==0.16.8", "actionlint-py==1.7.12.25"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cairn_api*"]

[tool.setuptools.package-data]
cairn_api = ["content/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
