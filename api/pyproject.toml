[project]
name = "cairn-api"
version = "0.1.0"
description = "Cairn MVP HTTP API. Implements the MVP use cases on top of the cairn database schema."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "psycopg[binary,pool]>=3.1",
  "pyjwt[crypto]>=2.8",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27", "jsonschema>=4.18"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cairn_api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
