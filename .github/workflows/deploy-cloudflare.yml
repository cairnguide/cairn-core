# Deploys Cairn to Cloudflare: the MongoDB schema, migrations, and templates (deploy-database.yml),
# then the Worker and container image.
# Run it by hand from the Actions tab (Deploy to Cloudflare > Run workflow) once main is green.
# One-time setup, including the secrets below, is in README.md under "Deploy to Cloudflare".
#
# Repository or "cloudflare" environment secrets:
#   CLOUDFLARE_API_TOKEN       token with Workers Scripts, Containers, and Durable Objects edit rights
#   CLOUDFLARE_ACCOUNT_ID
# The database secrets and variables are listed in deploy-database.yml.
name: Deploy to Cloudflare

on:
  workflow_dispatch:
    inputs:
      allow_unreviewed_templates:
        description: "Load templates that haven't had counsel review (staging only, never production)"
        type: boolean
        default: false
      skip_database:
        description: "Skip the schema and templates (deploy code only)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  database:
    name: Database
    if: ${{ !inputs.skip_database }}
    uses: ./.github/workflows/deploy-database.yml
    with:
      environment: cloudflare
      allow_unreviewed_templates: ${{ inputs.allow_unreviewed_templates }}
    secrets: inherit

  deploy:
    name: Deploy
    needs: database
    if: ${{ !cancelled() && (needs.database.result == 'success' || needs.database.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: cloudflare
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json

      - name: Deploy the Worker and container image
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm ci
          npx wrangler deploy
