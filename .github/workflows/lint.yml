# Shared lint job, called by the branch-push and pull-request workflows.
name: Lint

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api/pyproject.toml
            database/tools/requirements.txt

      - name: Install
        run: pip install -e 'api[test,lint]' -r database/tools/requirements.txt

      - name: Python (ruff)
        run: ruff check --output-format=github .

      - name: Shell scripts (shellcheck)
        run: shellcheck .github/scripts/*.sh scripts/*.sh

      - name: GitHub Actions workflows (actionlint)
        run: actionlint

      - name: Auth0 Action (JavaScript syntax)
        run: node --check auth0/actions/*.js

      - name: Task templates (JSON Schema and content rules)
        # --allow-unreviewed: drafts are allowed on branches. The counsel review
        # gate (the loader without this flag) belongs on release tags.
        run: python database/tools/load_templates.py --dry-run --allow-unreviewed

      - name: OpenAPI contract is up to date
        run: |
          python api/scripts/export_openapi.py
          git diff --exit-code api/openapi.json || {
            echo "::error file=api/openapi.json::openapi.json is out of date. Run: python api/scripts/export_openapi.py"
            exit 1
          }

  cloudflare:
    name: Cloudflare Worker and container image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json

      - name: Install
        run: npm ci

      - name: Type-check the Worker
        run: npx wrangler types && npx tsc --noEmit

      - name: Build the container image and bundle the Worker (no upload)
        run: npx wrangler deploy --dry-run
