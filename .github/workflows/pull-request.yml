# Runs every check on pull requests into main, and again after each merge.
# The "All checks passed" job is the one required status check. The ruleset
# in .github/rulesets/protect-main.json blocks merging until it succeeds.
name: Pull request

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pull-request-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    uses: ./.github/workflows/lint.yml

  api-tests:
    name: API and data security tests (MongoDB ${{ matrix.mongodb }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mongodb: ["7.0", "8.0"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api/pyproject.toml
            database/tools/requirements.txt

      - name: Install
        run: pip install -e 'api[test]' -r database/tools/requirements.txt

      - name: Start MongoDB (throwaway replica set with authentication)
        env:
          MONGODB_VERSION: ${{ matrix.mongodb }}
        run: .github/scripts/start-mongodb.sh "$MONGODB_VERSION"

      - name: Run every test, including the use case and data security suites
        working-directory: api
        env:
          CAIRN_TEST_MONGODB_URI: mongodb://admin:admin@localhost:27017/?replicaSet=rs0  # throwaway CI container
        # Fails if any database test is skipped, so a broken database
        # connection can't produce a green run with nothing actually tested.
        # Coverage of cairn_api, with the floor in api/pyproject.toml ([tool.coverage.report] fail_under).
        run: |
          pytest -ra --junitxml=results.xml --cov --cov-report=term
          python - <<'PY'
          import sys, xml.etree.ElementTree as ET
          suite = ET.parse("results.xml").getroot().iter("testsuite")
          skipped = sum(int(s.get("skipped", 0)) for s in suite)
          if skipped:
              sys.exit(f"{skipped} test(s) were skipped. Every test must run on a pull request.")
          PY

  all-checks-passed:
    name: All checks passed
    if: always()
    needs: [lint, api-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for r in $RESULTS; do
            if [[ "$r" != "success" ]]; then
              echo "::error::At least one required job did not succeed ($r)."
              exit 1
            fi
          done
