# Runs every check on pull requests into main, and again after each merge.
# The "All checks passed" job is the one required status check. The ruleset
# in .github/rulesets/protect-main.json blocks merging until it succeeds.
name: Pull request

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pull-request-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    uses: ./.github/workflows/lint.yml

  api-tests:
    name: API tests (Postgres ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        postgres: ["15", "16"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres  # throwaway CI container, not a real credential
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/pyproject.toml

      - name: Install
        run: pip install -e 'api[test]'

      - name: Run all API tests, including the database use case suite
        working-directory: api
        env:
          CAIRN_TEST_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
        # Fails if any database test is skipped, so a broken database
        # connection can't produce a green run with nothing actually tested.
        run: |
          pytest -ra --junitxml=results.xml
          python - <<'PY'
          import sys, xml.etree.ElementTree as ET
          suite = ET.parse("results.xml").getroot().iter("testsuite")
          skipped = sum(int(s.get("skipped", 0)) for s in suite)
          if skipped:
              sys.exit(f"{skipped} test(s) were skipped. Every test must run on a pull request.")
          PY

  database-tests:
    name: Database security checks (Postgres ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        postgres: ["15", "16"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres  # throwaway CI container, not a real credential
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: database/tools/requirements.txt

      - name: Install
        run: |
          pip install -r database/tools/requirements.txt
          command -v psql || { sudo apt-get update && sudo apt-get install -y postgresql-client; }

      - name: Migrations, loader, and verify.sql
        env:
          ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: database/db/tests/run.sh

  all-checks-passed:
    name: All checks passed
    if: always()
    needs: [lint, api-tests, database-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for r in $RESULTS; do
            if [[ "$r" != "success" ]]; then
              echo "::error::At least one required job did not succeed ($r)."
              exit 1
            fi
          done
